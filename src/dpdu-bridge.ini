; Settings for dpdu-bridge-c.dll and dpdu-bridge-cs.dll (both read this file).
; It must sit in the same folder as the DLLs. For version-specific settings,
; copy it to dpdu-bridge-c.ini and/or dpdu-bridge-cs.ini there: each DLL reads
; the ini named after it if that exists, else this one.
;
; A missing or empty value uses the built-in default (listed in README.md).
; At least one of [Serial] Port and [Tcp] Port is required; without either,
; an error message is shown and no port is opened. With both, they work at
; the same time.

[Serial]
; COM port name, e.g. COM8 (with com0com, the simulator uses the other end of
; the pair); leave empty to disable the serial link
Port=COM8
; baud rate (ignored by com0com virtual ports)
Baud=115200

[Tcp]
; TCP port number to listen on (1-65535); leave empty to disable the TCP server
Port=55555
; IPv4 or IPv6 address to listen on: 127.0.0.1 or ::1 accept local clients only;
; 0.0.0.0 accepts IPv4 clients from other machines; :: accepts IPv4 and IPv6 clients
Bind=127.0.0.1

[Log]
; 1 = write a log file, 0 = no logging (default 0)
Enabled=0
; log file path; default: dpdu-bridge-c.log / dpdu-bridge-cs.log next to the DLL
File=

[Device]
; module name reported to the D-PDU API host
ModuleName=D-PDU Serial/TCP Bridge
; value returned by PDU_IOCTL_READ_VBATT, in millivolts (the simulator can
; change it with "VBATT <mV>")
VBattMilliVolts=13000
; 1 = apply PDU_IOCTL_START_MSG_FILTER pass/block filters to received VPW/ALDL
; frames, 0 = deliver all frames
SoftwareFilters=1
