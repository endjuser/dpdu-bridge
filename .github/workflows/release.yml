# Builds both drivers on every push to main and every pull request; the files
# are attached to the run as the "dpdu-bridge" artifact.  Pushing a version
# tag also publishes a GitHub release with them:
#
#   git tag v1.0.0
#   git push origin v1.0.0
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build C driver
        shell: cmd
        run: .\build.cmd c

      - name: Build C# driver
        shell: cmd
        run: .\build.cmd cs

      - name: Add the registration example
        shell: cmd
        run: copy pdu_api_root.example.xml build\ && copy j2534_register.example.reg build\

      - uses: actions/upload-artifact@v4
        with:
          name: dpdu-bridge
          path: |
            build/dpdu-bridge-c.dll
            build/dpdu-bridge-cs.dll
            build/dpdu-bridge.ini
            build/pdu_api_root.example.xml
            build/j2534_register.example.reg
          if-no-files-found: error

  # Only version tags publish a release; this is the only job that can write
  # to the repository.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dpdu-bridge
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME" --generate-notes
